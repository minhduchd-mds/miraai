[package]
name = "mira-desktop"
version = "0.2.0"
description = "Mira — voice-first AI companion desktop app"
authors = ["Mira"]
edition = "2021"
rust-version = "1.89"

[build-dependencies]
tauri-build = { version = "2.7.0", features = [] }

[dependencies]
tauri = { version = "2.12.0", features = [] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
unicode-normalization = "0.1"
lofty = "=0.25.4"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_UI_Input_KeyboardAndMouse"] }
