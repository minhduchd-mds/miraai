name: Desktop Native Check

on:
  push:
    branches: ["main"]
    paths:
      - "src-tauri/**"
      - "src/desktop/**"
      - "src/intelligence/memory/desktop-memory-store.ts"
      - "src/settings/StructuredMemoryInspector.tsx"
      - ".github/workflows/desktop-check.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "src-tauri/**"
      - "src/desktop/**"
      - "src/intelligence/memory/desktop-memory-store.ts"
      - "src/settings/StructuredMemoryInspector.tsx"
      - ".github/workflows/desktop-check.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-native-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: Native ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15-intel, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable

      - name: Cargo check
        run: cargo check --manifest-path src-tauri/Cargo.toml --all-targets

      - name: Cargo test
        run: cargo test --manifest-path src-tauri/Cargo.toml
