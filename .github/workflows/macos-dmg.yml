name: macOS DMG

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "src-tauri/**"
      - "src/desktop/**"
      - "src/intelligence/memory/**"
      - "src/intelligence/skills/desktop-music-skill.ts"
      - "src/runtime/turn-manager.ts"
      - ".github/workflows/macos-dmg.yml"
      - "scripts/build-desktop.mjs"
      - "scripts/*desktop*.mjs"
      - "package*.json"

permissions:
  contents: read

concurrency:
  group: mira-macos-dmg
  cancel-in-progress: true

jobs:
  build-intel-dmg:
    runs-on: macos-15-intel
    timeout-minutes: 35

    env:
      RELEASE_TAG: v0.2.0
      RELEASE_DMG: Mira-v0.2.0-macOS-Intel.dmg

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Install frontend dependencies
        run: npm ci

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          targets: x86_64-apple-darwin

      - name: Install Tauri CLI
        run: npm install --no-save --package-lock=false @tauri-apps/cli@2.12.0

      - name: Tauri environment
        run: npx tauri info

      - name: Build Intel DMG
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY_SECRET: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${APPLE_CERTIFICATE:-}" ]; then
            echo "MACOS_SIGNING_ENABLED=true" >> "$GITHUB_ENV"
            test -n "${APPLE_SIGNING_IDENTITY_SECRET:-}" || { echo "APPLE_SIGNING_IDENTITY is required with a certificate"; exit 1; }
            export APPLE_SIGNING_IDENTITY="$APPLE_SIGNING_IDENTITY_SECRET"
            [[ "$APPLE_SIGNING_IDENTITY" == "Developer ID Application:"* ]] || { echo "Expected Developer ID Application identity"; exit 1; }
            echo "Apple signing certificate detected; Tauri will sign the app."
          else
            echo "MACOS_SIGNING_ENABLED=false" >> "$GITHUB_ENV"
            # Tauri treats an empty-but-present certificate variable as an
            # import request. Remove it for a genuinely ad-hoc build.
            unset APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD
            export APPLE_SIGNING_IDENTITY="-"
            echo "No Apple certificate configured; building with ad-hoc signing."
          fi

          if [ -n "${APPLE_ID:-}" ] && [ -n "${APPLE_PASSWORD:-}" ] && [ -n "${APPLE_TEAM_ID:-}" ]; then
            echo "MACOS_NOTARIZATION_ENABLED=true" >> "$GITHUB_ENV"
            echo "Apple notarization credentials detected."
          else
            echo "MACOS_NOTARIZATION_ENABLED=false" >> "$GITHUB_ENV"
            unset APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID
            echo "Notarization credentials are incomplete; notarization disabled."
          fi

          npx tauri build --bundles dmg --target x86_64-apple-darwin

      - name: Validate DMG
        shell: bash
        run: |
          set -euo pipefail
          dmg="$(find src-tauri/target/x86_64-apple-darwin/release/bundle/dmg -name '*.dmg' -type f | head -n 1)"
          test -n "$dmg"
          echo "DMG=$dmg"
          ls -lh "$dmg"
          hdiutil verify "$dmg"

          mount_dir="$(mktemp -d)"
          cleanup() {
            hdiutil detach "$mount_dir" -quiet >/dev/null 2>&1 || true
            rmdir "$mount_dir" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          hdiutil attach "$dmg" -nobrowse -readonly -mountpoint "$mount_dir"
          app="$(find "$mount_dir" -maxdepth 2 -name '*.app' -type d | head -n 1)"
          test -n "$app"
          echo "APP=$app"
          codesign --verify --deep --strict "$app"
          codesign -dv --verbose=4 "$app" 2>&1 | tee /tmp/mira-codesign.txt

          if [ "${MACOS_SIGNING_ENABLED:-false}" = "true" ]; then
            if ! grep -q '^Authority=Developer ID Application:' /tmp/mira-codesign.txt; then
              echo "Expected Developer ID signature metadata was not found."
              exit 1
            fi
            echo "✅ macOS Developer ID signature verified." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "⚠️ macOS artifact uses ad-hoc signing; configure APPLE_CERTIFICATE to enable Developer ID signing." >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ "${MACOS_NOTARIZATION_ENABLED:-false}" = "true" ]; then
            xcrun stapler validate "$dmg"
            spctl --assess --type execute --verbose=4 "$app"
            echo "✅ macOS notarization/stapling verified." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "⚠️ macOS notarization is not configured." >> "$GITHUB_STEP_SUMMARY"
          fi

          binary="$(find "$app/Contents/MacOS" -maxdepth 1 -type f | head -n 1)"
          test -n "$binary"
          file "$binary"
          file "$binary" | grep -q 'x86_64'

      - name: Stage release DMG
        shell: bash
        run: |
          set -euo pipefail
          dmg="$(find src-tauri/target/x86_64-apple-darwin/release/bundle/dmg -name '*.dmg' -type f | head -n 1)"
          test -n "$dmg"
          mkdir -p release
          cp "$dmg" "release/$RELEASE_DMG"
          shasum -a 256 "release/$RELEASE_DMG" | sed 's#release/##' > "release/$RELEASE_DMG.sha256"
          ls -lh release
          cat "release/$RELEASE_DMG.sha256"
          node - <<'NODE'
          const fs = require('node:fs');
          const crypto = require('node:crypto');
          const artifact = process.env.RELEASE_DMG;
          fs.writeFileSync('release/release-validation.json', JSON.stringify({
            format: 'mira.desktop-release-validation', schemaVersion: 1,
            commit: process.env.GITHUB_SHA, platform: 'macos-intel', artifact,
            sha256: crypto.createHash('sha256').update(fs.readFileSync(`release/${artifact}`)).digest('hex'),
            signed: process.env.MACOS_SIGNING_ENABLED === 'true',
            notarized: process.env.MACOS_NOTARIZATION_ENABLED === 'true',
          }, null, 2));
          NODE

      - name: Upload DMG build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Mira-macOS-Intel-DMG
          path: |
            release/*.dmg
            release/*.sha256
            release/release-validation.json
          if-no-files-found: error
          retention-days: 30
