name: macOS DMG

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "src-tauri/**"
      - "src/desktop/**"
      - "src/intelligence/memory/**"
      - "src/intelligence/skills/desktop-music-skill.ts"
      - "src/runtime/turn-manager.ts"
      - ".github/workflows/macos-dmg.yml"

permissions:
  contents: read

concurrency:
  group: mira-macos-dmg
  cancel-in-progress: true

jobs:
  build-intel-dmg:
    runs-on: macos-15-intel
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install frontend dependencies
        run: npm ci

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin

      - name: Install Tauri CLI
        run: npm install --no-save --package-lock=false @tauri-apps/cli@2.12.0

      - name: Tauri environment
        run: npx tauri info

      - name: Build Intel DMG
        env:
          APPLE_SIGNING_IDENTITY: "-"
        run: npx tauri build --bundles dmg --target x86_64-apple-darwin

      - name: Validate DMG
        shell: bash
        run: |
          set -euo pipefail
          dmg="$(find src-tauri/target/x86_64-apple-darwin/release/bundle/dmg -name '*.dmg' -type f | head -n 1)"
          test -n "$dmg"
          echo "DMG=$dmg"
          ls -lh "$dmg"
          hdiutil verify "$dmg"

          mount_dir="$(mktemp -d)"
          cleanup() {
            hdiutil detach "$mount_dir" -quiet >/dev/null 2>&1 || true
            rmdir "$mount_dir" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          hdiutil attach "$dmg" -nobrowse -readonly -mountpoint "$mount_dir"
          app="$(find "$mount_dir" -maxdepth 2 -name '*.app' -type d | head -n 1)"
          test -n "$app"
          echo "APP=$app"
          codesign --verify --deep --strict "$app"
          binary="$(find "$app/Contents/MacOS" -maxdepth 1 -type f | head -n 1)"
          test -n "$binary"
          file "$binary"
          file "$binary" | grep -q 'x86_64'

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: Mira-macOS-Intel-DMG
          path: src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 30
