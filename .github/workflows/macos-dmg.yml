name: macOS DMG

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "src-tauri/**"
      - "src/desktop/**"
      - "src/intelligence/memory/**"
      - "src/intelligence/skills/desktop-music-skill.ts"
      - "src/runtime/turn-manager.ts"
      - ".github/workflows/macos-dmg.yml"

permissions:
  contents: write

concurrency:
  group: mira-macos-dmg
  cancel-in-progress: true

jobs:
  build-intel-dmg:
    runs-on: macos-15-intel
    timeout-minutes: 35

    env:
      RELEASE_TAG: v0.1.0
      RELEASE_DMG: Mira-v0.1.0-macOS-Intel.dmg

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Install frontend dependencies
        run: npm ci

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          targets: x86_64-apple-darwin

      - name: Install Tauri CLI
        run: npm install --no-save --package-lock=false @tauri-apps/cli@2.12.0

      - name: Tauri environment
        run: npx tauri info

      - name: Build Intel DMG
        env:
          APPLE_SIGNING_IDENTITY: "-"
        run: npx tauri build --bundles dmg --target x86_64-apple-darwin

      - name: Validate DMG
        shell: bash
        run: |
          set -euo pipefail
          dmg="$(find src-tauri/target/x86_64-apple-darwin/release/bundle/dmg -name '*.dmg' -type f | head -n 1)"
          test -n "$dmg"
          echo "DMG=$dmg"
          ls -lh "$dmg"
          hdiutil verify "$dmg"

          mount_dir="$(mktemp -d)"
          cleanup() {
            hdiutil detach "$mount_dir" -quiet >/dev/null 2>&1 || true
            rmdir "$mount_dir" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          hdiutil attach "$dmg" -nobrowse -readonly -mountpoint "$mount_dir"
          app="$(find "$mount_dir" -maxdepth 2 -name '*.app' -type d | head -n 1)"
          test -n "$app"
          echo "APP=$app"
          codesign --verify --deep --strict "$app"
          binary="$(find "$app/Contents/MacOS" -maxdepth 1 -type f | head -n 1)"
          test -n "$binary"
          file "$binary"
          file "$binary" | grep -q 'x86_64'

      - name: Stage release DMG
        shell: bash
        run: |
          set -euo pipefail
          dmg="$(find src-tauri/target/x86_64-apple-darwin/release/bundle/dmg -name '*.dmg' -type f | head -n 1)"
          test -n "$dmg"
          mkdir -p release
          cp "$dmg" "release/$RELEASE_DMG"
          shasum -a 256 "release/$RELEASE_DMG" | sed 's#release/##' > "release/$RELEASE_DMG.sha256"
          ls -lh release
          cat "release/$RELEASE_DMG.sha256"

      - name: Upload DMG to GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release view "$RELEASE_TAG" >/dev/null
          gh release upload "$RELEASE_TAG"             "release/$RELEASE_DMG"             "release/$RELEASE_DMG.sha256"             --clobber

      - name: Verify macOS release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          assets="$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name')"
          echo "$assets"
          grep -Fxq "$RELEASE_DMG" <<<"$assets"
          grep -Fxq "$RELEASE_DMG.sha256" <<<"$assets"

      - name: Upload DMG build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Mira-macOS-Intel-DMG
          path: |
            release/*.dmg
            release/*.sha256
          if-no-files-found: error
          retention-days: 30
