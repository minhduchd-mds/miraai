name: Sync Neon Config Dependency

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/neon-config-sync.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Sync @neon/config
        run: npm install --save-dev @neon/config@latest --package-lock-only

      - name: Commit lockfile
        shell: bash
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "Neon config dependency already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore: install Neon config dependency"
          git push origin HEAD:main
