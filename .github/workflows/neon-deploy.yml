name: Deploy Neon Backend

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID || secrets.NEON_PROJECT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Neon CLI
        run: npm i -g neon@latest

      - name: Verify Neon credential
        shell: bash
        run: |
          set +x
          if [ -z "$NEON_API_KEY" ] || [ -z "$NEON_PROJECT_ID" ]; then
            echo "NEON_API_KEY or NEON_PROJECT_ID is missing."
            exit 1
          fi
          echo "Neon credentials are configured."

      - name: Link Neon project
        run: neon link --project-id "$NEON_PROJECT_ID" --branch production -y

      - name: Deploy neon.ts
        run: neon deploy
