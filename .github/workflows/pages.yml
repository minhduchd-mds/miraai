# Mira static Pages publisher — Vite build -> gh-pages branch
name: Build GitHub Pages branch

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: github-pages-branch
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    environment: elevenlabs
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        env:
          VITE_MIRA_TTS_URL: https://miraai-five.vercel.app/api
        run: npm run build

      - name: Neural TTS gateway smoke
        env:
          MIRA_TTS_URL: https://miraai-five.vercel.app/api
        shell: bash
        run: |
          set -euo pipefail
          url="${MIRA_TTS_URL%/}/health"
          status="$(curl --silent --show-error --output /tmp/mira-tts-health.json --write-out "%{http_code}" "$url")"
          if [ "$status" != "200" ]; then
            echo "Mira TTS gateway health failed (HTTP $status)"
            exit 1
          fi
          node -e "const fs=require('fs'); const j=JSON.parse(fs.readFileSync('/tmp/mira-tts-health.json','utf8')); if(!j.ok) process.exit(1); console.log('Mira TTS gateway: reachable; provider='+(j.provider||'unknown')+'; configured='+Boolean(j.configured));"

      - name: Prune heavy Labs assets
        run: npm run prune:pages

      - name: Prepare static fallback
        run: |
          cp dist/index.html dist/404.html
          touch dist/.nojekyll

      - name: Pages artifact smoke
        run: npm run check:pages

      - name: Publish gh-pages branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd dist
          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b gh-pages
          git add -A
          git commit -m "deploy: ${GITHUB_SHA}"
          git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:gh-pages
