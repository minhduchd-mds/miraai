# Mira static Pages publisher — Vite build -> gh-pages branch
name: Build GitHub Pages branch

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: github-pages-branch
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Decode Mira photoreal asset
        run: |
          mkdir -p public/looks
          cat             assets-source/mira-photoreal.part00             assets-source/mira-photoreal.part01             assets-source/mira-photoreal.part02             assets-source/mira-photoreal.part03             assets-source/mira-photoreal.part08             assets-source/mira-photoreal.part09             assets-source/mira-photoreal.part10             assets-source/mira-photoreal.part11             assets-source/mira-photoreal.part12             assets-source/mira-photoreal.part13             assets-source/mira-photoreal.part14             assets-source/mira-photoreal.part15             | base64 --decode > public/looks/mira-photoreal.webp
          echo "a20d86a2156032fa98944311fd3049803702a025125ea31484c46e88dc8ba398  public/looks/mira-photoreal.webp" | sha256sum -c -

      - name: Decode Mira bedroom scene
        run: |
          mkdir -p public/scenes
          cat \
            assets-source/mira-bedroom.part00 \
            assets-source/mira-bedroom.part01 \
            assets-source/mira-bedroom.part02 \
            assets-source/mira-bedroom.part03 \
            assets-source/mira-bedroom.part04 \
            assets-source/mira-bedroom.part05 \
            assets-source/mira-bedroom.part06 \
            assets-source/mira-bedroom.part07 \
            assets-source/mira-bedroom.part08 \
            assets-source/mira-bedroom.part09 \
            assets-source/mira-bedroom.part10 \
            | base64 --decode > public/scenes/mira-bedroom.webp
          echo "1f9b1cd14e0b99eae846f51251e869b2693ba8c38039c6c52ea85dc5e145cc99  public/scenes/mira-bedroom.webp" | sha256sum -c -

      - name: Build
        run: npm run build

      - name: Prepare static fallback
        run: |
          cp dist/index.html dist/404.html
          touch dist/.nojekyll

      - name: Publish gh-pages branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd dist
          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b gh-pages
          git add -A
          git commit -m "deploy: ${GITHUB_SHA}"
          git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:gh-pages
