name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [24.x, 26.x]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Architecture guard
        run: npm run check:architecture

      - name: Skill contract guard
        run: npm run check:skills

      - name: Type-check
        run: npx tsc --noEmit

      - name: Runtime unit tests
        run: npm test

      - name: Functional benchmark gate
        run: npm run benchmark:functional

      - name: Camera trace benchmark gate
        run: npm run benchmark:camera

      - name: Media asset budget
        run: npm run check:media

      - name: Build (Vite)
        run: npm run build

      - name: Initial bundle budget
        run: npm run check:bundle

      - name: Deploy artifact smoke
        run: npm run check:artifact

      - name: Build desktop web profile
        if: matrix.node-version == '24.x'
        run: npm run build:desktop

      - name: Desktop artifact smoke
        if: matrix.node-version == '24.x'
        run: npm run check:desktop

      - name: Runtime dependency audit (critical)
        run: npm audit --omit=dev --audit-level=critical
