name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x, 24.x]

    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Architecture guard
        run: npm run check:architecture

      - name: Skill contract guard
        run: npm run check:skills

      - name: Type-check
        run: npx tsc --noEmit

      - name: Runtime unit tests
        run: npm test

      - name: Functional benchmark gate
        run: npm run benchmark:functional

      - name: Build (Vite)
        run: npm run build

      - name: Initial bundle budget
        run: npm run check:bundle

      - name: Deploy artifact smoke
        run: npm run check:artifact

      - name: Runtime dependency audit (critical)
        run: npm audit --omit=dev --audit-level=critical
