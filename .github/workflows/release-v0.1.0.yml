name: Release Mira v0.1.0

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: mira-release-v0.1.0
  cancel-in-progress: false

jobs:
  publish-validated-intel-dmg:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      RELEASE_TAG: v0.1.0
      RELEASE_NAME: Mira v0.1.0
      RELEASE_DMG: Mira-v0.1.0-macOS-Intel.dmg

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Real-device release gate
        env:
          DEVICE_LAB_RESULTS: ${{ secrets.DEVICE_LAB_RESULTS }}
        run: |
          npm ci
          node scripts/check-device-release.mjs

      - name: Verify version contract
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('fs');
          const tauri = JSON.parse(fs.readFileSync('src-tauri/tauri.conf.json', 'utf8'));
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          if (tauri.version !== '0.1.0') throw new Error('tauri version must be 0.1.0');
          if (pkg.version !== '0.1.0') throw new Error('package version must be 0.1.0');
          console.log('Mira version contract: 0.1.0');
          NODE

      - name: Resolve latest validated macOS DMG run
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          run_id="$(gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow "macos-dmg.yml" \
            --branch main \
            --commit "$GITHUB_SHA" \
            --status success \
            --limit 1 \
            --json databaseId \
            --jq '.[0].databaseId')"
          test -n "$run_id"
          test "$run_id" != "null"
          echo "VALIDATED_DMG_RUN=$run_id" >> "$GITHUB_ENV"
          echo "Using macOS DMG workflow run: $run_id"

      - name: Download validated macOS DMG artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-src release
          gh run download "$VALIDATED_DMG_RUN" \
            --repo "$GITHUB_REPOSITORY" \
            --name "Mira-macOS-Intel-DMG" \
            --dir release-src

          node scripts/validate-desktop-release.mjs release-src
          cp "release-src/$RELEASE_DMG" "release/$RELEASE_DMG"
          cp "release-src/$RELEASE_DMG.sha256" "release/$RELEASE_DMG.sha256"
          ls -lh release/
          cat "release/$RELEASE_DMG.sha256"

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          cat > /tmp/release-notes.md <<'EOF'
          ## Mira v0.1.0

          Bản cài đặt macOS đầu tiên của **Mira — Voice-first AI Companion**.

          ### Có trong bản này
          - Voice-first UI, không cần thanh chat.
          - Presence scene tự động theo thời gian/ngữ cảnh.
          - Camera/vision cho face, hand, pose và interaction.
          - Memory + contextual companion runtime.
          - ElevenLabs neural voice gateway.
          - WebP presence assets và Visual QA/device-profile regression.
          - Desktop shell bằng Tauri, đóng gói frontend local.

          ### macOS
          - **Intel x86_64**
          - **macOS Ventura 13.0+**
          - File cài đặt: `Mira-v0.1.0-macOS-Intel.dmg`

          ### Xác minh
          File DMG được lấy từ **latest successful `macos-dmg.yml` run** trên nhánh `main` cho đúng commit phát hành.
          Workflow bắt buộc:
          - `hdiutil verify`
          - `codesign --verify --deep --strict`
          - binary architecture `x86_64`
          - Developer ID Application signature + stapling + Gatekeeper validation
          - 3 real-device PASS results bound to the release commit

          ### Lưu ý
          Bản ad-hoc hoặc chưa notarize chỉ được giữ dưới dạng build artifact, không được xuất bản bởi workflow này.

          SHA256 được đính kèm trong file `.sha256`.
          EOF

          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            git fetch origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
            test "$(git rev-parse "$RELEASE_TAG^{commit}")" = "$GITHUB_SHA" || { echo "Release tag does not match validated commit"; exit 1; }
            gh release upload "$RELEASE_TAG"               "release/$RELEASE_DMG"               "release/$RELEASE_DMG.sha256"               --repo "$GITHUB_REPOSITORY"               --clobber
            gh release edit "$RELEASE_TAG"               --repo "$GITHUB_REPOSITORY"               --title "$RELEASE_NAME"               --notes-file /tmp/release-notes.md               --latest
          else
            gh release create "$RELEASE_TAG"               "release/$RELEASE_DMG"               "release/$RELEASE_DMG.sha256"               --repo "$GITHUB_REPOSITORY"               --target "$GITHUB_SHA"               --title "$RELEASE_NAME"               --notes-file /tmp/release-notes.md               --latest
          fi

      - name: Verify published release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json tagName,name,isDraft,isPrerelease,url,assets
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -Fx "$RELEASE_DMG"
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -Fx "$RELEASE_DMG.sha256"
