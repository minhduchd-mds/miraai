name: Visual QA

on:
  push:
    branches: ["main"]
    paths:
      - "src/app/**"
      - "src/presence/**"
      - "src/ui/**"
      - "src/settings/**"
      - "src/core/vision/spatial-*.ts"
      - "src/app/vision-hand-interaction.ts"
      - "public/mira-assets/**"
      - "scripts/visual-qa.spec.mjs"
      - "scripts/capability-smoke.spec.mjs"
      - "playwright.config.mjs"
      - ".github/workflows/visual-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mira-visual-qa
  cancel-in-progress: true

jobs:
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install project
        run: npm ci

      - name: Install Playwright runner
        run: npm install --no-save --package-lock=false @playwright/test@1.55.0

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build Mira
        run: npm run build

      - name: Run visual and capability QA
        run: npx playwright test --config=playwright.config.mjs

      - name: Upload visual QA output
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mira-visual-qa-${{ github.sha }}
          path: |
            artifacts/visual-qa
            visual-report
            test-results
          if-no-files-found: warn
          retention-days: 30
